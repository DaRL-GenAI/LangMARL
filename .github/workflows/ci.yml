name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check langmarl scripts tests examples

      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          pip install build
          python -m build

      - name: The wheel must carry the critic prompts
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          prompts = [n for n in names if "/prompts/" in n and n.endswith(".json")]
          assert prompts, f"{wheel} bundles no prompt files"
          for env in ("language", "pistonball", "overcooked"):
              assert any(f"envs/{env}/prompts/" in n for n in prompts), f"missing {env} prompts"
          print(f"{len(prompts)} prompt files bundled")
          PY
